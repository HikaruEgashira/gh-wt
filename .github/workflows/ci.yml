name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  shell-lint:
    name: shell lint
    runs-on: [self-hosted, linux, arm64, hikae-flash]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: bash -n (syntax)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          shopt -s nullglob
          bash -n gh-wt
          for f in lib/*.sh; do
            bash -n "$f"
          done
      - name: install shellcheck
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Self-hosted runners (unlike the ubuntu-* hosted images) do not
          # guarantee shellcheck is preinstalled. Provision it rather than
          # dropping the lint, and skip the install when it is already there.
          if command -v shellcheck >/dev/null 2>&1; then
            exit 0
          fi
          if [[ "$(id -u)" -eq 0 ]]; then
            apt-get update
            apt-get install -y shellcheck
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - name: shellcheck
        timeout-minutes: 5
        run: |
          set -euo pipefail
          shopt -s nullglob
          shellcheck --version
          shellcheck -S warning gh-wt lib/*.sh
